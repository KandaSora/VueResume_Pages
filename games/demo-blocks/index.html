<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>方块碰撞</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d1117; overflow: hidden; }
  body { display: flex; flex-direction: column; align-items: center; font-family: system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; color: #e6edf3; }
  .hint { padding: 10px 16px; font-size: 13px; color: #8b949e; text-align: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<p class="hint">模拟 WebGL 加载：本页为占位演示 · 点击画面暂停 / 恢复</p>
<canvas id="game" width="800" height="480"></canvas>
<script>
(function () {
  const canvas = document.getElementById('game')
  const ctx = canvas.getContext('2d')
  const BLOCKS = [
    { x: 140, y: 120, s: 44, vx: 90, vy: 60, color: '#22d3ee' },
    { x: 420, y: 260, s: 56, vx: -70, vy: -90, color: '#f97316' },
    { x: 600, y: 120, s: 36, vx: -100, vy: 70, color: '#a78bfa' },
    { x: 300, y: 380, s: 48, vx: 80, vy: -50, color: '#34d399' }
  ]
  let paused = false
  let last = performance.now()

  function resize() {
    const scale = Math.min(window.innerWidth / 800, (window.innerHeight - 52) / 480)
    const w = Math.max(320, Math.floor(800 * Math.max(0.4, scale)))
    canvas.style.width = w + 'px'
    canvas.style.height = Math.floor(w * 0.6) + 'px'
  }
  window.addEventListener('resize', resize)
  resize()

  canvas.addEventListener('pointerdown', function () {
    paused = !paused
  })

  function step(now) {
    const dt = Math.min((now - last) / 1000, 0.033)
    last = now
    if (!paused) {
      for (const b of BLOCKS) {
        b.x += b.vx * dt
        b.y += b.vy * dt
        if (b.x < 8) { b.x = 8; b.vx = Math.abs(b.vx) }
        if (b.x + b.s > 792) { b.x = 792 - b.s; b.vx = -Math.abs(b.vx) }
        if (b.y < 8) { b.y = 8; b.vy = Math.abs(b.vy) }
        if (b.y + b.s > 472) { b.y = 472 - b.s; b.vy = -Math.abs(b.vy) }
      }
    }

    ctx.clearRect(0, 0, 800, 480)
    ctx.fillStyle = '#161b22'
    ctx.fillRect(0, 0, 800, 480)
    ctx.strokeStyle = '#22d3ee'
    ctx.lineWidth = 2
    ctx.strokeRect(1, 1, 798, 478)
    for (const b of BLOCKS) {
      ctx.fillStyle = b.color
      ctx.fillRect(b.x, b.y, b.s, b.s)
      ctx.strokeStyle = 'rgba(255,255,255,0.25)'
      ctx.lineWidth = 1
      ctx.strokeRect(b.x + 0.5, b.y + 0.5, b.s - 1, b.s - 1)
    }
    if (paused) {
      ctx.fillStyle = 'rgba(13,17,23,0.55)'
      ctx.fillRect(0, 0, 800, 480)
      ctx.fillStyle = '#e6edf3'
      ctx.font = '28px system-ui, "PingFang SC", "Microsoft YaHei", sans-serif'
      ctx.textAlign = 'center'
      ctx.fillText('已暂停', 400, 245)
    }

    requestAnimationFrame(step)
  }
  requestAnimationFrame(step)
})()
</script>
</body>
</html>
