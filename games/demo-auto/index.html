<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>MostInOne</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-webgl-logo"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">MostInOne</div>
      </div>
    </div>
    <script>

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");
      var warningBanner = document.querySelector("#unity-warning");

      // 复用内建 Default 模板的横幅逻辑：非致命警告/错误以临时横幅展示。
      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/WebGL.loader.js";
      var config = {
        dataUrl: buildUrl + "/WebGL.data.gz",
        frameworkUrl: buildUrl + "/WebGL.framework.js.gz",
        codeUrl: buildUrl + "/WebGL.wasm.gz",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "MostInOne",
        productVersion: "1.0.0",
        showBanner: unityShowBanner,
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // 桌面为本项目唯一承诺平台；移动分支沿用内建模板行为，仅作尽力而为。
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        container.className = "unity-mobile";
        canvas.className = "unity-mobile";
      } else {
        // GFX-02 / D-15：桌面画布随窗口自适应。
        // 只改 CSS 尺寸 —— Unity 2022 会自动把 WebGL 渲染目标同步到 canvas 的 CSS 尺寸；
        // 手写 canvas.width/height 会与自动同步打架（官方 issue：画布无限缩放变黑）。
        // footer 高度从 DOM 实测：#unity-footer 自身无高度声明、子元素全 float、无 clearfix ⇒ 盒高塌陷为 0。
        function footerReservedHeight() {
          var footer = document.querySelector("#unity-footer");
          if (!footer) return 0;
          if (window.getComputedStyle(footer).display === "none") return 0;
          var rect = footer.getBoundingClientRect();
          if (rect.height > 1) return Math.ceil(rect.height);
          var kids = footer.children, max = 0;
          for (var i = 0; i < kids.length; i++) max = Math.max(max, kids[i].getBoundingClientRect().height);
          return Math.ceil(max);
        }

        function fitCanvasDesktop() {
          var reserved = footerReservedHeight();
          var aspect = 960 / 600;
          var availW = Math.max(1, window.innerWidth);
          var availH = Math.max(1, window.innerHeight - reserved);
          var cssW = availW;
          var cssH = cssW / aspect;
          if (cssH > availH) { cssH = availH; cssW = cssH * aspect; }
          canvas.style.width = Math.floor(cssW) + "px";
          canvas.style.height = Math.floor(cssH) + "px";
        }

        fitCanvasDesktop();
        window.addEventListener("resize", function () {
          // 全屏时由 Unity 自己接管画布尺寸；这里让路，退出全屏后再回到自适应。
          if (document.fullscreenElement || document.webkitFullscreenElement) return;
          fitCanvasDesktop();
        });
        document.addEventListener("fullscreenchange", function () {
          if (!document.fullscreenElement && !document.webkitFullscreenElement) fitCanvasDesktop();
        });
      }

      // 打开即开始加载并创建 Unity 实例（无首次点击门）。
      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          progressBarFull.style.width = (100 * progress) + "%";
        }).then(function (unityInstance) {
          loadingBar.style.display = "none";
          fullscreenButton.onclick = function () {
            unityInstance.SetFullscreen(1);
          };
        }).catch(function (message) {
          alert(message);
        });
      };
      document.body.appendChild(script);

    </script>
  </body>
</html>
