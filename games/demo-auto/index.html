<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
    <title>MostInOne</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      /* 480 消歧：fit-inside 模板（参考 demo-islandBreaker/index.html）。
         canvas 恒 8:5（960×600）等比缩放居中——宽窗上下黑边、窄窗左右黑边，不拉伸不裁剪。
         只改 CSS 尺寸：Unity 2022+ 默认 matchWebGLToCanvasSize，会自动把 WebGL 渲染目标
         同步到 canvas 的 CSS 尺寸；手写 canvas.width/height 会与自动同步打架（画布无限缩放变黑）。
         站点 PlayModal 的 iframe 视口宽高比 == 本 canvas 宽高比 ⇒ 弹窗内游戏正好铺满无白边。 */
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        touch-action: none;
        overscroll-behavior: none;
      }
      #unity-canvas {
        width: min(100vw, calc(100vh * 8 / 5));
        height: min(100vh, calc(100vw * 5 / 8));
        background: #231F20;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
    <div id="unity-loading-bar">
      <div id="unity-logo"></div>
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>
    <div id="unity-warning"> </div>
    <script src="Build/WebGL.loader.js"></script>
    <script>

      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var warningBanner = document.querySelector("#unity-warning");

      // 非致命警告/错误以临时横幅展示（加载失败时唯一的可见反馈）。
      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // 桌面为本项目唯一承诺平台；移动分支沿内建模板行为，仅作尽力而为（铺满视口）。
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        canvas.style.width = "100%";
        canvas.style.height = "100%";
        canvas.style.position = "fixed";
      }

      // 打开即开始加载并创建 Unity 实例（无首次点击门）。
      loadingBar.style.display = "block";

      createUnityInstance(canvas, {
        dataUrl: "Build/WebGL.data",
        frameworkUrl: "Build/WebGL.framework.js",
        codeUrl: "Build/WebGL.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "MostInOne",
        productVersion: "1.0.0",
        showBanner: unityShowBanner,
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      }, function (progress) {
        progressBarFull.style.width = (100 * progress) + "%";
      }).then(function () {
        loadingBar.style.display = "none";
      }).catch(function (message) {
        loadingBar.style.display = "none";
        alert(message);
      });

    </script>
  </body>
</html>
