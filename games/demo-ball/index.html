<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>弹跳小球 Demo</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d1117; overflow: hidden; }
  body { position: relative; display: flex; align-items: center; justify-content: center; font-family: system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; color: #e6edf3; }
  /* 提示行绝对定位悬浮（不占布局空间）：canvas 独占整个视口，游戏必然完整显示 */
  .hint { position: absolute; top: 0; left: 0; right: 0; z-index: 1; padding: 10px 16px; font-size: 13px; color: #8b949e; text-align: center; }
  canvas { display: block; touch-action: none; border: 6px solid #ff4d4f; box-sizing: border-box; }
</style>
</head>
<body>
<p id="hint" class="hint">模拟 WebGL 加载：本页为占位演示 · 点击屏幕给小球一个向上的力</p>
<canvas id="game" width="800" height="480"></canvas>
<script>
(function () {
  const canvas = document.getElementById('game')
  const hint = document.getElementById('hint')
  const ctx = canvas.getContext('2d')
  const ball = { x: 400, y: 100, r: 24, vx: 160, vy: 0 }
  const G = 520   // 重力加速度（px/s²）
  const FLOOR = 460 - 24
  const BOUNCE = 0.78  // 弹跳阻尼
  const WALLS = { left: 24, right: 800 - 24 }
  let last = performance.now()

  function resize() {
    // 上下左右各留 16px 空位（用户指定），canvas 等比缩放完整显示在留空区域内
    const GAP = 16
    const scale = Math.max(
      0,
      Math.min((window.innerWidth - GAP * 2) / 800, (window.innerHeight - GAP * 2) / 480),
    )
    const w = Math.floor(800 * scale)
    const h = Math.floor(480 * scale)
    canvas.style.width = w + 'px'
    canvas.style.height = h + 'px'
    hint.textContent = '占位演示 · 点击屏幕给小球一个向上的力 · 逻辑 800×480 → 显示 ' + w + '×' + h
  }
  window.addEventListener('resize', resize)
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(resize)
  resize()

  function kick() {
    ball.vy = -Math.max(260, Math.abs(ball.vy) * 0.9)
  }
  canvas.addEventListener('pointerdown', kick)

  function step(now) {
    const dt = Math.min((now - last) / 1000, 0.033)
    last = now
    ball.vy += G * dt
    ball.x += ball.vx * dt
    ball.y += ball.vy * dt
    if (ball.y > FLOOR) { ball.y = FLOOR; ball.vy = -ball.vy * BOUNCE; if (Math.abs(ball.vy) < 60) ball.vy = 0 }
    if (ball.x < WALLS.left) { ball.x = WALLS.left; ball.vx = Math.abs(ball.vx) }
    if (ball.x > WALLS.right) { ball.x = WALLS.right; ball.vx = -Math.abs(ball.vx) }

    ctx.clearRect(0, 0, 800, 480)
    ctx.fillStyle = '#161b22'
    ctx.fillRect(0, 0, 800, 480)
    ctx.strokeStyle = '#22d3ee'
    ctx.lineWidth = 2
    ctx.strokeRect(1, 1, 798, 478)
    ctx.strokeStyle = '#8b949e'
    ctx.lineWidth = 3
    ctx.beginPath()
    ctx.moveTo(20, 460)
    ctx.lineTo(780, 460)
    ctx.stroke()

    const g = ctx.createRadialGradient(ball.x - 8, ball.y - 10, 4, ball.x, ball.y, ball.r)
    g.addColorStop(0, '#a5f3fc')
    g.addColorStop(0.5, '#22d3ee')
    g.addColorStop(1, '#0891b2')
    ctx.fillStyle = g
    ctx.beginPath()
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2)
    ctx.fill()

    requestAnimationFrame(step)
  }
  requestAnimationFrame(step)
})()
</script>
</body>
</html>
